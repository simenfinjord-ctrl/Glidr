services:
  - type: web
    name: glidr-web
    env: node
    plan: starter
    rootDir: .
    buildCommand: npm install && npm run build
    startCommand: npm run start
    autoDeploy: true
    healthCheckPath: /api/auth/me
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: glidr-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true

databases:
  - name: glidr-db
    plan: starter
